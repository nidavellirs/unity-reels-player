<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Shorts</title>

    <style>
        body,html{
            margin:0;
            padding:0;
            background:black;
            overflow:hidden;
            font-family:Arial,sans-serif;
        }

        /* players */
        .player{
            position:absolute;
            width:100%;
            height:100%;
            top:0;
            left:0;
            transition:transform 0.35s ease;
        }

        .player iframe{
            pointer-events:none;
            background:black;
        }

        /* thumb */
        #thumb{
            position:absolute;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:5;
            opacity:0;
            transition:opacity 0.25s;
        }

        /* tap hint */
        #tap{
            position:absolute;
            bottom:40px;
            left:50%;
            transform:translateX(-50%);
            color:white;
            background:rgba(0,0,0,0.6);
            padding:8px 14px;
            border-radius:20px;
            z-index:10;
        }

        /* center control */
        #centerControl{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            width:54px;
            height:54px;
            background:rgba(0,0,0,0.5);
            border-radius:50%;
            display:none;
            align-items:center;
            justify-content:center;
            z-index:20;
        }

        #centerControl svg{
            width:38px;
            height:38px;
            fill:white;
        }


        .session-dialog{
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;

            background: rgba(0,0,0,0.65);

            display:none;
            justify-content:center;
            align-items:center;

            z-index:9999;

            /* space from screen edges */
            padding:20px;

            box-sizing:border-box;
        }

        .dialog-box{

            width:100%;
            max-width:320px;

            background:#ffffff;

            border-radius:16px;

            padding:26px 22px;

            text-align:center;

            box-shadow:0 12px 35px rgba(0,0,0,0.25);

            box-sizing:border-box;
        }

        .dialog-text{
            font-size:16px;
            line-height:1.5;
            color:#333;
            margin-bottom:20px;
        }

        .login-btn{

            width:100%;

            background:#6b0b3bcc;
            color:#fff;

            border:none;
            border-radius:10px;

            padding:12px 0;

            font-size:15px;
            font-weight:600;

            cursor:pointer;
        }

        .login-btn:active{
            transform:scale(0.97);
            background: rgba(188, 76, 132, 0.8);
        }
        #loader{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background:black;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:9999;
        }

        .loader-content{
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        .spinner{
            width:40px;
            height:40px;
            border:4px solid rgba(255,255,255,0.2);
            border-top:4px solid white;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        .loader-text{
            margin-top:12px;
            color:white;
            font-style:italic;
            font-size:14px;
            letter-spacing:0.5px;
        }

        @keyframes spin{
            0%{transform:rotate(0deg);}
            100%{transform:rotate(360deg);}
        }
        #overlay{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            z-index:50;
        }

        /** OVERLAY **/

        /* ── UI OVERLAY ── */
        #uiOverlay{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events:none;
        }

        #uiOverlay .categories,
        #uiOverlay .top-header {
            pointer-events: all;
        }

        /* ── TOP HEADER ── */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px 14px 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
        }

        .app-logo {
            height: 54px;
            width: auto;
            object-fit: contain;
            margin-top: 25px;
            margin-left: 10px;

        }

        .app-icon-placeholder {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .app-name {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .app-name span:first-child {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .app-name span:last-child {
            font-size: 10px;
            font-weight: 600;
            color: #f7931e;
            letter-spacing: 1px;
        }

        /* ── RIGHT CATEGORIES ── */
        .categories {
            position: absolute;
            right: 10px;
            top: 65%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            min-width: 54px;
            border-radius: 20px;
        }

        .cat-icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(31,32,34,0.4);
            transition: all 0.2s ease;
            color: rgba(255,255,255,0.75);
        }

        .category-item .cat-label {
            font-size: 14px;
            font-weight: 300;
            color: #ffffff;
            text-align: center;
            transition: all 0.2s ease;
        }

        /* Selected */
        /* .category-item.selected {
            background: rgba(247,147,30,0.2);
        } */

        .category-item.selected .cat-icon-wrap {
            background: #ffffff;
            color: #000;
        }

        .category-item.selected .cat-label {
            color: #ffffff;
            font-weight: 700;
        }

        /* .category-item.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 55%;
            background: #f7931e;
            border-radius: 0 3px 3px 0;
        } */

        /* ── BOTTOM GRADIENT ── */
        .bottom-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
            pointer-events: none;
        }

        /* ── BOTTOM CHANNEL INFO ── */
        .overlay {
            position: absolute;
            bottom: 24px;
            left: 14px;
            right: 70px;
        }

        .bottom-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 30px;
        }
        .share-btn{
            margin-left: 30px;
        }

        .bottom-left {
            flex: 1;
            min-width: 0;
        }

        .channel-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .yt-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 6px;
        }

        .channel-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .reel-title {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>

<div id="container" style="display: none">
    <div id="p2" class="player"></div>
    <div id="p1" class="player"></div>
    <div id="current" class="player"></div>
    <div id="n1" class="player"></div>
    <div id="n2" class="player"></div>
    <img id="thumb">
    <div id="overlay">
        <div id="uiOverlay">
            <!-- Top Header -->
            <div class="top-header">
                <img src="logo.png" class="app-logo" alt="Durlabh Darshan">
            </div>

            <!-- Right Categories -->
            <div class="categories" id="categories"></div>

            <!-- Bottom gradient fade -->
            <div class="bottom-gradient"></div>

            <!-- Channel name only, no share -->
            <div class="overlay">
                <div class="bottom-row">
                    <div class="bottom-left">
                        <div class="channel-row">
                            <svg class="yt-icon" viewBox="0 0 90 63" xmlns="http://www.w3.org/2000/svg">
                                <path d="M88.1 9.9C87.1 6.3 84.2 3.4 80.6 2.4 73.5 0.5 45.2 0.5 45.2 0.5S16.9 0.5 9.8 2.4C6.2 3.4 3.3 6.3 2.3 9.9 0.4 17 0.4 31.7 0.4 31.7S0.4 46.4 2.3 53.5C3.3 57.1 6.2 60 9.8 61 16.9 62.9 45.2 62.9 45.2 62.9S73.5 62.9 80.6 61C84.2 60 87.1 57.1 88.1 53.5 90 46.4 90 31.7 90 31.7S90 17 88.1 9.9Z" fill="#FF0000"/>
                                <polygon points="36,45.2 59.4,31.7 36,18.2" fill="white"/>
                            </svg>
                            <span class="channel-name" id="channelName">Bhakti Reels</span>
                        </div>
                        <div class="reel-title" id="reelTitle">Title goes here</div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="centerControl"></div>
<div id="sessionDialog" class="session-dialog">
    <div class="dialog-box">
        <p class="dialog-text">
            Session expired. Please relogin to watch this reel.
        </p>

        <button class="login-btn" onclick="reLogin()">
            Login Again
        </button>
    </div>
</div>
<div id="tap">Tap to enable sound</div>
<div id="loader">
    <div class="loader-content">
        <div class="spinner"></div>
        <div class="loader-text">Initializing Player...</div>
    </div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="categories.js"></script>
<script>

    /* ---------------- CONFIG ---------------- */

    const API_URL = "https://growonlinked.in"
    const LIMIT = 5
    let categoryId = "";
    const params = new URLSearchParams(window.location.search)
    const AUTH_TOKEN = params.get("token")

    /* ---------------- STATE ---------------- */

    let reels = []
    let currentIndex = 0
    let cursorId = null
    let loading = false

    let players = {}
    let positions = ["p2","p1","current","n1","n2"]

    let isUnmuted = false

    /* ---------------- API ---------------- */

    async function fetchReels(){

        if (AUTH_TOKEN===null){
            showSessionExpiredDialog();
            return;
        }

        if(loading) return

        loading = true

        let url = API_URL+"/reels/feeds?categoryId="+categoryId+"&limit="+LIMIT;
        if(cursorId){
            url += "&cursorId=" + cursorId
        }

        try{
            const res = await fetch(url,{
                headers:{
                    "Authorization":"Bearer "+AUTH_TOKEN
                }
            })

            if(res.status === 401){

                showSessionExpiredDialog()
                loading = false
                return
            }

            const json = await res.json()

            reels.push(...(json.data.reels || []))
            cursorId = json.data.cursorId

            console.log("Reels:", reels.length)

        }catch(e){
            console.error(e)
            showSessionExpiredDialog()
        }

        loading = false
    }

    /* ---------------- INIT ---------------- */

    async function initFeed(){
        buildCategories();
        await fetchReels()

        if(reels.length === 0){
            console.error("No reels")
            return
        }

        if(window.YT && YT.Player){
            initPlayers()
        }
    }

    function onYouTubeIframeAPIReady(){
        initFeed()
    }

    /* ---------------- HELPERS ---------------- */

    function getVideoId(i){
        if(i < 0 || i >= reels.length) return ""
        return reels[i]?.videoId || ""
    }

    /* ---------------- PLAYER INIT ---------------- */

    function initPlayers(){

        players.p2 = create("p2", null)
        players.p1 = create("p1", null)

        players.current = create("current", getVideoId(0), true)

        players.n1 = create("n1", getVideoId(1))
        players.n2 = create("n2", getVideoId(2))

        updatePositions()
    }

    function create(id, videoId, autoplay=false){

        return new YT.Player(id,{
            videoId: videoId || "",
            playerVars:{
                autoplay: autoplay ? 1 : 0,
                mute:1,
                controls:0,
                modestbranding:1,
                rel:0,
                playsinline:1,
                enablejsapi:1,
                origin: window.location.origin,
                widget_referrer: window.location.origin,
                fs:0,
                disablekb:1
            },
            events:{
                onReady:(e)=>{
                    if(autoplay && videoId){

                        let p = e.target

                        p.mute() // always start muted

                        setTimeout(()=>{
                            p.playVideo()

                            // 🔥 FIX: reapply unmute if user already enabled
                            if(isUnmuted){
                                try{
                                    p.unMute()
                                    p.setVolume(100)
                                }catch(err){}
                            }

                        },100)


                        updateReelInfo()
                        //e.target.playVideo()
                        document.getElementById("loader").style.display = "none";
                        document.getElementById("container").style.display = "block";
                    }
                },
                onStateChange:(e)=>{
                    if(id === positions[2] && e.data === YT.PlayerState.PLAYING){
                        hideThumb()
                        centerControl.style.display = "none"
                    }
                    if(id === positions[2] && e.data === YT.PlayerState.ENDED){
                        nextVideo()
                    }
                },
                onError:(e)=>{
                    document.getElementById("thumb").style.display = "none";
                }
            }
        })
    }

    /* ---------------- POSITION ---------------- */

    function updatePositions(){
        document.getElementById(positions[0]).style.transform = "translateY(-200%)"
        document.getElementById(positions[1]).style.transform = "translateY(-100%)"
        document.getElementById(positions[2]).style.transform = "translateY(0)"
        document.getElementById(positions[3]).style.transform = "translateY(100%)"
        document.getElementById(positions[4]).style.transform = "translateY(200%)"
    }

    /* ---------------- PLAY CONTROL ---------------- */

    function playCurrent(){

        let currentPlayer = players[positions[2]]

        Object.values(players).forEach(p=>{
            try{
                p.pauseVideo()
                p.mute()
            }catch(e){}
        })

        setTimeout(()=>{
            try{
                currentPlayer.seekTo(0,true)
                currentPlayer.playVideo()

                if(isUnmuted){
                    currentPlayer.unMute()
                    currentPlayer.setVolume(100)
                }
            }catch(e){}
        },50)
    }

    /* ---------------- NAVIGATION ---------------- */

    function nextVideo(){

        centerControl.style.display = "none"

        if(currentIndex >= reels.length - 1) return

        currentIndex++

        showThumb()

        let first = positions.shift()
        positions.push(first)
        updateReelInfo()
        updatePositions()

        let newVideo = getVideoId(currentIndex + 2)
        if(newVideo){
            players[positions[4]].loadVideoById(newVideo)
        }

        playCurrent()

        if(!loading && reels.length - currentIndex <= 3){
            fetchReels()
        }
    }

    function prevVideo(){

        centerControl.style.display = "none"

        if(currentIndex <= 0) return

        currentIndex--

        showThumb()

        let last = positions.pop()
        positions.unshift(last)
        updateReelInfo()
        updatePositions()

        let newVideo = getVideoId(currentIndex - 2)
        if(newVideo){
            players[positions[0]].loadVideoById(newVideo)
        }

        playCurrent()
    }

    /* ---------------- THUMB ---------------- */

    function showThumb(){
        let id = reels[currentIndex]?.videoId
        if(!id) return

        let t = document.getElementById("thumb")
        t.src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`
        t.style.opacity = "1"
    }

    function hideThumb(){
        document.getElementById("thumb").style.opacity = "0"
    }

    /* ---------------- TAP ---------------- */

    function handleTap(){

        let currentPlayer = players[positions[2]]

        if(!isUnmuted){
            isUnmuted = true
            document.getElementById("tap").style.display="none"

            currentPlayer.unMute()
            currentPlayer.setVolume(100)
            currentPlayer.playVideo()
            return
        }

        let state = currentPlayer.getPlayerState()

        if(state === YT.PlayerState.PLAYING){
            currentPlayer.pauseVideo()
            showPlayIcon()
        }else{
            currentPlayer.playVideo()
            showPauseIcon()

            setTimeout(()=>{
                centerControl.style.display="none"
            },800)
        }
    }

    /* ---------------- ICONS ---------------- */

    function showPlayIcon(){
        centerControl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>`
        centerControl.style.display="flex"
    }

    function showPauseIcon(){
        centerControl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"></path></svg>`
        centerControl.style.display="flex"
    }

    /* ---------------- SWIPE ---------------- */

    let startY = 0
    let lastGesture = 0

    window.addEventListener("touchstart", e=>{
        startY = e.touches[0].clientY
    })

    window.addEventListener("touchend", e=>{

        let now = Date.now()
        if(now - lastGesture < 300) return
        lastGesture = now

        let endY = e.changedTouches[0].clientY
        let diff = startY - endY

        if(Math.abs(diff) > 80){
            if(diff > 0){
                nextVideo()
            }else{
                prevVideo()
            }
        }else{
            handleTap()
        }
    })

    /* desktop */
    window.addEventListener("wheel", e=>{
        if(e.deltaY > 0){
            nextVideo()
        }else{
            prevVideo()
        }
    })


    function showSessionExpiredDialog(){
        document.getElementById("sessionDialog").style.display="flex"
        document.getElementById("loader").style.display = "none";
    }

    function reLogin(){
        logout();
    }
    function logout(){
        window.location.href = "uniwebview://logout";
    }

    function updateReelInfo(){
        if(!reels[currentIndex])
            return

        const reel = reels[currentIndex]

        document.getElementById("channelName").innerText = reel.channel.name || "Unknown Channel"
        document.getElementById("reelTitle").innerText = reel.title || ""
    }


    async function reloadFeed(){

        /* ---------- RESET STATE ---------- */

        reels = []
        cursorId = null
        currentIndex = 0
        loading = false

        centerControl.style.display = "none"
        document.getElementById("thumb").style.opacity = "0"

        /* ---------- FETCH NEW DATA ---------- */

        await fetchReels()

        if(reels.length === 0){
            console.error("No reels for category")
            return
        }

        /* ---------- RESET PLAYERS ---------- */

        // 🔥 destroy old players (VERY IMPORTANT)
        Object.values(players).forEach(p=>{
            try{
                p.destroy()
            }catch(e){}
        })

        players = {}

        /* ---------- RESET POSITIONS ---------- */

        positions = ["p2","p1","current","n1","n2"]

        /* ---------- RE-INIT PLAYERS ---------- */

        initPlayers()

        /* ---------- RESET UI ---------- */

        updateReelInfo?.() // safe call if exists
    }
</script>

</body>
</html>
